<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma TGDQ - Gestão de Dados Quantitativos</title>
  <style>
    :root {
      --primary: #1a73e8;
      --primary-hover: #1557b0;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --text: #202124;
      --text-muted: #5f6368;
      --success: #137333;
      --success-bg: #e6f4ea;
      --border: #dadce0;
      --warning-bg: #fef7e0;
      --warning-border: #f2994a;
      --purple-bg: #f3e8ff;
      --purple-border: #9333ea;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 20px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container { width: 100%; max-width: 980px; }

    /* Top Bar do Professor */
    .top-bar-admin {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 15px;
    }
    .btn-prof-top {
      background: #202124;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .btn-prof-top:hover { background: #3c4043; }

    header { text-align: center; margin-bottom: 20px; }
    header h1 { color: var(--primary); font-size: 1.8rem; margin-bottom: 5px; }
    header p { color: var(--text-muted); font-size: 0.95rem; }

    /* Stepper Interativo */
    .stepper {
      display: flex;
      justify-content: space-between;
      background: var(--card-bg);
      padding: 15px 20px;
      border-radius: 12px;
      margin-bottom: 25px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .step {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      transition: color 0.2s;
    }
    .step:hover { color: var(--primary); }
    .step.active { color: var(--primary); font-weight: 700; }
    .step.completed { color: var(--success); }
    .step-number {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #e8eaed;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
    }
    .step.active .step-number { background: var(--primary); color: #fff; }
    .step.completed .step-number { background: var(--success); color: #fff; }

    .card {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .step-content { display: none; }
    .step-content.active { display: block; }

    h2 { color: var(--primary); margin-bottom: 15px; font-size: 1.4rem; }
    p.description { color: var(--text-muted); margin-bottom: 20px; font-size: 0.95rem; }

    .form-group { margin-bottom: 18px; }
    label { display: block; font-weight: 600; font-size: 0.88rem; margin-bottom: 6px; color: #333; }
    input[type="text"], input[type="url"], select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
