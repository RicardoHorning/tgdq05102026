<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma TGDQ - Gestão de Dados Quantitativos</title>
  <style>
    :root {
      --primary: #1a73e8;
      --primary-hover: #1557b0;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --text: #202124;
      --text-muted: #5f6368;
      --success: #137333;
      --success-bg: #e6f4ea;
      --border: #dadce0;
      --warning-bg: #fef7e0;
      --warning-border: #f2994a;
      --purple-bg: #f3e8ff;
      --purple-border: #9333ea;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 20px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container { width: 100%; max-width: 980px; }

    /* Top Bar do Professor */
    .top-bar-admin {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 15px;
    }
    .btn-prof-top {
      background: #202124;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .btn-prof-top:hover { background: #3c4043; }

    header { text-align: center; margin-bottom: 20px; }
    header h1 { color: var(--primary); font-size: 1.8rem; margin-bottom: 5px; }
    header p { color: var(--text-muted); font-size: 0.95rem; }

    /* Stepper Interativo */
    .stepper {
      display: flex;
      justify-content: space-between;
      background: var(--card-bg);
      padding: 15px 20px;
      border-radius: 12px;
      margin-bottom: 25px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .step {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      transition: color 0.2s;
    }
    .step:hover { color: var(--primary); }
    .step.active { color: var(--primary); font-weight: 700; }
    .step.completed { color: var(--success); }
    .step-number {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #e8eaed;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
    }
    .step.active .step-number { background: var(--primary); color: #fff; }
    .step.completed .step-number { background: var(--success); color: #fff; }

    .card {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .step-content { display: none; }
    .step-content.active { display: block; }

    h2 { color: var(--primary); margin-bottom: 15px; font-size: 1.4rem; }
    p.description { color: var(--text-muted); margin-bottom: 20px; font-size: 0.95rem; }

    .form-group { margin-bottom: 18px; }
    label { display: block; font-weight: 600; font-size: 0.88rem; margin-bottom: 6px; color: #333; }
    input[type="text"], input[type="url"], select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      font-family: inherit;
    }
    textarea { resize: vertical; min-height: 80px; }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); }

    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      transition: background 0.2s;
      text-decoration: none;
    }
    .btn:hover { background-color: var(--primary-hover); }
    .btn-green { background-color: #1e8e3e; }
    .btn-green:hover { background-color: #137333; }

    /* Barra de Navegação entre Passos */
    .nav-buttons-bar {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .btn-nav {
      background-color: #f1f3f4;
      color: #3c4043;
      border: 1px solid #dadce0;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s, color 0.2s;
    }
    .btn-nav:hover { background-color: #e8eaed; color: #202124; }
    .btn-nav-primary {
      background-color: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }
    .btn-nav-primary:hover {
      background-color: var(--primary-hover);
      color: #ffffff;
    }

    /* Caixa de Reconexão */
    .reconexao-box {
      background: #e8f0fe;
      border: 2px solid #b6d4fe;
      padding: 18px;
      border-radius: 10px;
      margin-bottom: 25px;
    }
    .reconexao-box h3 {
      color: var(--primary);
      font-size: 1.05rem;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Estilo dos Passos de Orientação Fácil */
    .guia-passos { display: flex; flex-direction: column; gap: 15px; margin: 20px 0; }
    .guia-card {
      display: flex;
      align-items: flex-start;
      gap: 15px;
      background: #f8f9fa;
      border: 1px solid var(--border);
      padding: 15px;
      border-radius: 10px;
    }
    .guia-num {
      background: var(--primary);
      color: #fff;
      font-weight: bold;
      font-size: 1.1rem;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .guia-info h4 { color: var(--primary); margin-bottom: 4px; font-size: 1rem; }
    .guia-info p { font-size: 0.9rem; color: #444; }

    .id-explicacao-box {
      background: #e8f0fe;
      border: 1px solid #b6d4fe;
      padding: 18px;
      border-radius: 10px;
      margin: 20px 0;
    }
    .id-explicacao-box h4 { color: var(--primary); margin-bottom: 8px; font-size: 1rem; }
    .id-explicacao-box ul { margin-left: 20px; font-size: 0.88rem; color: #333; }
    .id-explicacao-box li { margin-bottom: 6px; }

    /* Caixa do Módulo Avançado (3 Abas) */
    .avancado-box {
      background: var(--purple-bg);
      border: 2px solid var(--purple-border);
      padding: 20px;
      border-radius: 10px;
      margin: 20px 0;
    }
    .avancado-box
